<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vital Sign Protocol | LiveAdaptiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b2945e; --stone: #fafaf9; --charcoal: #1c1917; }
        body { background-color: var(--stone); color: var(--charcoal); font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .blueprint-dot { background-image: radial-gradient(circle at 1px 1px, #e7e5e4 1px, transparent 0); background-size: 30px 30px; }
        
        #main-app-content { animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Range Slider matching LiveAdaptiv Brand */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--gold); cursor: pointer; margin-top: -10px; box-shadow: 0 0 10px rgba(178, 148, 94, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #e7e5e4; border-radius: 2px; }
        input[type=range]:focus { outline: none; }

        .slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="blueprint-dot">

    <!-- MAIN APP -->
    <div id="main-app-content" class="min-h-screen flex flex-col">
        
        <!-- Navigation -->
        <nav class="p-5 flex justify-between items-center sticky top-0 z-50 bg-stone-50/90 backdrop-blur-md border-b border-stone-200">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 border border-[#b2945e]/40 rounded-full flex items-center justify-center">
                    <span class="font-serif italic text-lg text-[#b2945e] pb-0.5">A</span>
                </div>
                <span class="text-[9px] font-bold uppercase tracking-[0.4em] text-stone-400">LiveAdaptiv</span>
            </div>
            <div class="text-[9px] font-bold uppercase tracking-widest text-[#b2945e] flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#b2945e] animate-pulse"></span> Clinical Triage
            </div>
        </nav>

        <main class="flex-1 max-w-3xl mx-auto w-full p-6 pb-32">
            <!-- Dynamic Content Area -->
            <div id="step-content" class="slide-in-right"></div>

            <!-- Progression Controls -->
            <div class="mt-12 pt-8 border-t border-stone-200 flex items-center justify-between">
                <button id="prev-btn" onclick="prevStep()" class="text-stone-400 hover:text-stone-900 font-serif italic text-lg transition-colors flex items-center gap-2 disabled:opacity-0 cursor-pointer">&larr; Previous</button>
                <div class="h-1 flex-1 mx-4 bg-stone-200 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-[#b2945e] w-0 transition-all duration-500 shadow-[0_0_10px_rgba(178,148,94,0.5)]"></div>
                </div>
                <button id="next-btn" onclick="nextStep()" class="bg-stone-900 text-stone-50 px-8 py-3 rounded-full hover:bg-[#b2945e] hover:text-white transition-all font-sans text-xs font-bold tracking-[0.2em] uppercase shadow-lg transform hover:-translate-y-0.5">Next &rarr;</button>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // --- AUDIO ENGINE ---
        const decompressionAudio = new Audio('decompression.m4a');
        let isAudioPlaying = false;

        function toggleAudio() {
            const btnText = document.getElementById('audio-text');
            const btnIcon = document.getElementById('audio-icon');

            if (isAudioPlaying) {
                decompressionAudio.pause();
                isAudioPlaying = false;
                if(btnText) btnText.innerText = "Play Guided Audio (2:00)";
                if(btnIcon) btnIcon.innerHTML = `<i data-lucide="play-circle" class="w-5 h-5 text-[#b2945e]"></i>`;
            } else {
                decompressionAudio.play().catch(e => {
                    alert("Audio file not found. Make sure 'decompression.m4a' is uploaded to your repository.");
                });
                isAudioPlaying = true;
                if(btnText) btnText.innerText = "Pause Audio";
                if(btnIcon) btnIcon.innerHTML = `<i data-lucide="pause-circle" class="w-5 h-5 text-[#b2945e]"></i>`;
            }
            lucide.createIcons();
        }

        decompressionAudio.onended = function() {
            isAudioPlaying = false;
            const btnText = document.getElementById('audio-text');
            const btnIcon = document.getElementById('audio-icon');
            if(btnText) btnText.innerText = "Play Guided Audio (2:00)";
            if(btnIcon) btnIcon.innerHTML = `<i data-lucide="play-circle" class="w-5 h-5 text-[#b2945e]"></i>`;
            lucide.createIcons();
        };

        // --- PROTOCOL CONTENT ---
        const content = {
          intro: {
            badge: 'Clinical Edition',
            title: 'Vital Sign<br>Protocol.',
            body: 'Built for high-acuity medical and psychiatric teams. We maintain clinical safety without sacrificing empathy.'
          },
          assessment: {
            phase: 'Phase 01',
            title: 'The Triage',
            body: 'Quantify your friction and diagnose your current autonomic state before engaging with patients or colleagues.',
            sliderLabel: 'Friction Baseline',
            sliderSub: 'Quantify current somatic stress',
            sliderMinLabel: '1 (Regulated)',
            sliderMaxLabel: '10 (Overload)',
            statePrompt: 'Select Autonomic State (Required)',
            hyperarousalLabel: 'Hyperarousal (Sympathetic)',
            hyperarousalDesc: 'Racing heart, shallow breath, agitation, rushing. The "Fight or Flight" response.',
            hypoarousalLabel: 'Hypoarousal (Dorsal Vagal)',
            hypoarousalDesc: 'Numbness, fog, dissociation, exhaustion. The "Freeze or Fold" response.'
          },
          protocol: {
            phase: 'Phase 02',
            title: 'The Intervention',
            hyperarousal: {
              diagnosisTitle: 'Diagnosis: Sympathetic Overdrive',
              diagnosisBody: 'Your system is flooded with cortisol. You cannot out-think this state; you must manually apply the biological brakes before entering the clinical space.',
              step1Title: '1. The 90-Second Flush',
              step1Body: 'Do not speak. Take a sharp double-inhale through the nose, followed by a long, slow sigh through the mouth. Repeat for 90 seconds to metabolize the chemical dump.',
              step2Title: '2. Linear Override',
              step2Body: 'Panic operates in loops. Logic is a line. Name 3 physical objects in the room. State the exact time. Switch your brain from emotional computing to analytical computing.'
            },
            hypoarousal: {
              diagnosisTitle: 'Diagnosis: Dorsal Vagal Freeze',
              diagnosisBody: 'Your system has initiated a shutdown response to protect against perceived overwhelm. We need to gently up-regulate your nervous system back online.',
              step1Title: '1. The Somatic Anchor',
              step1Body: 'Change your physical temperature immediately. Splash cold water on your face or hold something freezing. This shocks the vagus nerve back into engagement.',
              step2Title: '2. Micro-Commitment',
              step2Body: 'Do not look at the entire shift. Focus only on the next 5 minutes. Execute one single, microscopic task to prove to your brain that you possess agency.'
            }
          },
          output: {
            phase: 'Phase 03',
            title: 'The Scrub-In',
            body: 'Surgeons wash their hands before touching a patient. You must wash your mind. Execute the scrub-in ritual and quantify your shift.',
            boundaryLabel: 'Psychological Boundary',
            acknowledgeLabel: 'I acknowledge my friction is currently:',
            actionLabel: 'But I am stepping into the clinical space. My sovereign action is to:',
            actionPlaceholder: 'maintain absolute presence...',
            auditLabel: 'Post-Protocol Audit',
            auditSub: 'Re-evaluate your somatic state',
            baselineLabel: 'Entry Baseline:'
          }
        };

        // --- DATA & STATE ---
        let appState = {
            currentStep: 0,
            entries: {
                pre_friction: 5,
                arousal_state: "",
                somatic_anchor: "",
                post_friction: 5
            }
        };

        function setArousalState(state) {
            appState.entries.arousal_state = state;
            renderStep();
        }

        function saveEntry(field, value) {
            appState.entries[field] = value;
        }

        function updateSliderValue(sliderId, displayId, field) {
            const val = document.getElementById(sliderId).value;
            document.getElementById(displayId).innerText = val;
            saveEntry(field, parseInt(val));
            
            if(field === 'post_friction') {
                calculateDelta();
            }
        }

        function calculateDelta() {
            const pre = appState.entries.pre_friction;
            const post = appState.entries.post_friction;
            const delta = post - pre;
            const display = document.getElementById('delta-display');
            
            if(display) {
                if(delta < 0) {
                    display.innerHTML = `<span class="text-teal-600 font-bold">${Math.abs(delta)} Points of Friction Metabolized</span>`;
                } else if (delta === 0) {
                    display.innerHTML = `<span class="text-stone-500 font-bold">Friction Baseline Maintained</span>`;
                } else {
                    display.innerHTML = `<span class="text-rose-600 font-bold">+${delta} Friction Increased</span>`;
                }
            }
        }

        // --- THE CYCLES (CONTENT MAP) ---
        const contentMap = [
            {
                id: 'intro',
                render: () => `
                    <div class="text-center space-y-8 mt-12">
                        <span class="text-xs font-bold tracking-[0.3em] uppercase text-[#b2945e] border border-[#b2945e] px-3 py-1 rounded-full">${content.intro.badge}</span>
                        <h2 class="text-4xl md:text-6xl font-serif italic text-stone-900 leading-none">${content.intro.title}</h2>
                        <div class="w-16 h-1 bg-[#b2945e] mx-auto"></div>
                        <p class="text-lg text-stone-600 font-serif leading-relaxed max-w-xl mx-auto">
                            ${content.intro.body}
                        </p>
                    </div>`
            },
            {
                id: 'assessment',
                render: () => {
                    const state = appState.entries.arousal_state;
                    const preVal = appState.entries.pre_friction;
                    const c = content.assessment;
                    return `
                    <div class="space-y-8 mt-6">
                        <div class="border-b border-stone-300 pb-4">
                            <h2 class="text-5xl font-serif italic text-stone-900">${c.title}</h2>
                            <span class="text-xs font-bold uppercase tracking-widest text-[#b2945e] mb-2">${c.phase}</span>
                        </div>
                        <p class="font-serif text-xl text-stone-700 leading-relaxed">
                            ${c.body}
                        </p>

                        <!-- THE ENTRY SLIDER -->
                        <div class="bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
                            <div class="flex justify-between items-end mb-4">
                                <div>
                                    <h3 class="font-sans text-xs font-bold uppercase tracking-widest text-stone-900">${c.sliderLabel}</h3>
                                    <p class="text-[10px] text-stone-500 uppercase tracking-widest mt-1">${c.sliderSub}</p>
                                </div>
                                <div class="text-3xl font-serif italic text-[#b2945e]" id="pre-val-display">${preVal}</div>
                            </div>
                            <input type="range" id="pre-slider" min="1" max="10" value="${preVal}" class="w-full" oninput="updateSliderValue('pre-slider', 'pre-val-display', 'pre_friction')">
                            <div class="flex justify-between text-[10px] uppercase font-bold text-stone-400 mt-2">
                                <span>${c.sliderMinLabel}</span>
                                <span>${c.sliderMaxLabel}</span>
                            </div>
                        </div>

                        <!-- STATE SELECTOR -->
                        <div class="bg-stone-50 p-6 rounded-xl border border-stone-200 mt-6">
                            <p class="text-xs font-bold uppercase tracking-widest text-stone-500 mb-4">${c.statePrompt}</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <button onclick="setArousalState('Hyperarousal')" class="p-5 bg-white border rounded-lg transition-all text-left ${state === 'Hyperarousal' ? 'border-[#b2945e] bg-[#b2945e]/10 ring-1 ring-[#b2945e]' : 'border-stone-200 hover:border-stone-400'}">
                                    <span class="block font-bold text-stone-900 mb-1">${c.hyperarousalLabel}</span>
                                    <span class="text-xs text-stone-500">${c.hyperarousalDesc}</span>
                                </button>
                                <button onclick="setArousalState('Hypoarousal')" class="p-5 bg-white border rounded-lg transition-all text-left ${state === 'Hypoarousal' ? 'border-[#b2945e] bg-[#b2945e]/10 ring-1 ring-[#b2945e]' : 'border-stone-200 hover:border-stone-400'}">
                                    <span class="block font-bold text-stone-900 mb-1">${c.hypoarousalLabel}</span>
                                    <span class="text-xs text-stone-500">${c.hypoarousalDesc}</span>
                                </button>
                            </div>
                        </div>
                    </div>`
                }
            },
            {
                id: 'protocol',
                render: () => {
                    const state = appState.entries.arousal_state;
                    let protocolHtml = '';

                    const iconHTML = isAudioPlaying 
                        ? `<i data-lucide="pause-circle" class="w-5 h-5 text-[#b2945e]"></i>`
                        : `<i data-lucide="play-circle" class="w-5 h-5 text-[#b2945e]"></i>`;
                    const textHTML = isAudioPlaying
                        ? "Pause Audio"
                        : "Play Guided Audio (2:00)";

                    if (state === 'Hyperarousal') {
                        const p = content.protocol.hyperarousal;
                        protocolHtml = `
                            <div class="bg-rose-50 border border-rose-200 p-6 rounded-xl mb-6">
                                <h3 class="text-rose-600 font-bold text-xs uppercase tracking-widest mb-2">${p.diagnosisTitle}</h3>
                                <p class="text-sm text-stone-700">${p.diagnosisBody}</p>
                            </div>
                            <div class="space-y-6">
                                <div class="p-6 bg-white border border-stone-200 rounded-xl shadow-sm">
                                    <h4 class="font-serif text-xl text-stone-900 mb-2">${p.step1Title}</h4>
                                    <p class="text-sm text-stone-500 mb-4">${p.step1Body}</p>

                                    <!-- AUDIO BUTTON -->
                                    <button onclick="toggleAudio()" class="w-full bg-stone-50 text-stone-900 p-4 rounded-xl border border-stone-200 flex items-center justify-center gap-3 hover:bg-stone-100 transition-colors">
                                        <span id="audio-icon">${iconHTML}</span>
                                        <span id="audio-text" class="text-sm font-bold tracking-widest uppercase">${textHTML}</span>
                                    </button>
                                </div>
                                <div class="p-6 bg-white border border-stone-200 rounded-xl shadow-sm">
                                    <h4 class="font-serif text-xl text-stone-900 mb-2">${p.step2Title}</h4>
                                    <p class="text-sm text-stone-500">${p.step2Body}</p>
                                </div>
                            </div>
                        `;
                    } else {
                        const p = content.protocol.hypoarousal;
                        protocolHtml = `
                            <div class="bg-teal-50 border border-teal-200 p-6 rounded-xl mb-6">
                                <h3 class="text-teal-600 font-bold text-xs uppercase tracking-widest mb-2">${p.diagnosisTitle}</h3>
                                <p class="text-sm text-stone-700">${p.diagnosisBody}</p>
                            </div>
                            <div class="space-y-6">
                                <div class="p-6 bg-white border border-stone-200 rounded-xl shadow-sm">
                                    <h4 class="font-serif text-xl text-stone-900 mb-2">${p.step1Title}</h4>
                                    <p class="text-sm text-stone-500">${p.step1Body}</p>
                                </div>
                                <div class="p-6 bg-white border border-stone-200 rounded-xl shadow-sm">
                                    <h4 class="font-serif text-xl text-stone-900 mb-2">${p.step2Title}</h4>
                                    <p class="text-sm text-stone-500">${p.step2Body}</p>
                                </div>
                            </div>
                        `;
                    }

                    return `
                    <div class="space-y-8 mt-6">
                        <div class="border-b border-stone-300 pb-4">
                            <h2 class="text-5xl font-serif italic text-stone-900">${content.protocol.title}</h2>
                            <span class="text-xs font-bold uppercase tracking-widest text-[#b2945e] mb-2">${content.protocol.phase}</span>
                        </div>
                        ${protocolHtml}
                    </div>`
                }
            },
            {
                id: 'output',
                render: () => {
                    const state = appState.entries.arousal_state;
                    const preVal = appState.entries.pre_friction;
                    const postVal = appState.entries.post_friction;
                    const c = content.output;

                    return `
                    <div class="space-y-8 mt-6">
                        <div class="border-b border-stone-300 pb-4">
                            <h2 class="text-5xl font-serif italic text-stone-900">${c.title}</h2>
                            <span class="text-xs font-bold uppercase tracking-widest text-[#b2945e] mb-2">${c.phase}</span>
                        </div>
                        <p class="font-serif text-xl text-stone-700 leading-relaxed mb-8">
                            ${c.body}
                        </p>

                        <!-- THE SCRUB-IN RITUAL -->
                        <div class="bg-stone-900 text-stone-50 p-8 rounded-2xl relative overflow-hidden mb-8 shadow-xl">
                            <h3 class="font-sans text-xs font-bold uppercase tracking-widest text-[#b2945e] block mb-6">${c.boundaryLabel}</h3>
                            <div class="space-y-6">
                                <div>
                                    <span class="font-serif text-2xl text-stone-400">${c.acknowledgeLabel}</span>
                                    <p class="font-serif text-2xl text-white mt-1 border-b border-stone-700 pb-2">${state}</p>
                                </div>
                                <div>
                                    <span class="font-serif text-2xl text-stone-400">${c.actionLabel}</span>
                                    <input type="text" oninput="saveEntry('somatic_anchor', this.value)" value="${appState.entries.somatic_anchor}" class="bg-transparent border-b border-stone-700 w-full font-serif text-2xl text-[#b2945e] focus:outline-none focus:border-[#b2945e] p-1 mt-2" placeholder="${c.actionPlaceholder}">
                                </div>
                            </div>
                        </div>

                        <!-- THE EXIT SLIDER & METRICS -->
                        <div class="bg-white p-6 rounded-xl border border-stone-200 shadow-sm mb-8">
                            <div class="flex justify-between items-end mb-4">
                                <div>
                                    <h3 class="font-sans text-xs font-bold uppercase tracking-widest text-stone-900">${c.auditLabel}</h3>
                                    <p class="text-[10px] text-stone-500 uppercase tracking-widest mt-1">${c.auditSub}</p>
                                </div>
                                <div class="text-3xl font-serif italic text-[#b2945e]" id="post-val-display">${postVal}</div>
                            </div>
                            <input type="range" id="post-slider" min="1" max="10" value="${postVal}" class="w-full mb-6" oninput="updateSliderValue('post-slider', 'post-val-display', 'post_friction')">

                            <div class="pt-4 border-t border-stone-100 flex justify-between items-center">
                                <span class="text-[10px] uppercase font-bold text-stone-400 tracking-widest">${c.baselineLabel} ${preVal}</span>
                                <div id="delta-display" class="text-sm font-sans uppercase tracking-widest">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>`
                }
            }
        ];

        // --- NAVIGATION ENGINE ---
        function renderStep() {
            const step = contentMap[appState.currentStep];
            
            const contentDiv = document.getElementById('step-content');
            contentDiv.classList.remove('slide-in-right');
            void contentDiv.offsetWidth; 
            contentDiv.innerHTML = step.render();
            contentDiv.classList.add('slide-in-right');

            if (appState.currentStep === contentMap.length - 1) {
                calculateDelta();
            }

            const progress = (appState.currentStep / (contentMap.length - 1)) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            prevBtn.disabled = appState.currentStep === 0;
            
            if (appState.currentStep === 1 && !appState.entries.arousal_state) {
                nextBtn.disabled = true;
                nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                nextBtn.innerText = "Select State ->";
            } else {
                nextBtn.disabled = false;
                nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                
                if (appState.currentStep === contentMap.length - 1) {
                    nextBtn.innerHTML = "Return to Hub";
                } else {
                    nextBtn.innerHTML = "Next &rarr;";
                }
            }
            lucide.createIcons();
        }

        function nextStep() {
            if (appState.currentStep === contentMap.length - 1) {
                window.location.href = "https://liveadaptiv.com"; 
                return;
            }
            
            if (appState.currentStep === 1 && !appState.entries.arousal_state) {
                alert("Please select an Autonomic State to proceed.");
                return;
            }

            appState.currentStep++;
            renderStep();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevStep() {
            if (appState.currentStep > 0) {
                appState.currentStep--;
                renderStep();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        renderStep();
    </script>
</body>
</html>
